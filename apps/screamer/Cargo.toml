[package]
name = "screamer"
description = "Screamer Rally for modern Windows, running the original game code natively"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ScreamerRally"
path = "src/main.rs"

[dependencies]
sr-runtime = { path = "../../crates/sr-runtime" }
sr-disc.workspace = true
sr-render = { path = "../../crates/sr-render" }
sr-audio = { path = "../../crates/sr-audio" }
sr-input = { path = "../../crates/sr-input" }
sr-crt = { path = "../../crates/sr-crt" }
# the visibility editor (--vis-editor, docs/05-visibility-editor.md): a developer tool, left
# out of the player package (tools/package.ps1 builds without default features)
sr-viseditor = { path = "../../crates/sr-viseditor", optional = true }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Memory", "Win32_Security", "Win32_System_Environment", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging"] }
# the first-run window (welcome.rs): Direct2D, DirectWrite, WIC, the shell's folder picker
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows-numerics = "0.3.1"

[features]
default = ["vis-editor"]
vis-editor = ["dep:sr-viseditor"]
