[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
sr-disc = { path = "crates/sr-disc" }
sr-le = { path = "crates/sr-le" }
sr-scene = { path = "crates/sr-scene" }

[profile.release]
debug = "line-tables-only"
panic = "abort"

[profile.dev]
panic = "abort"
