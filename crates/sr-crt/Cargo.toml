[package]
name = "sr-crt"
description = "CRT emulation: a Rust port of ShaderGlass's Direct3D 11 shader runtime and its RetroArch shader library pack"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_SystemInformation"] }
