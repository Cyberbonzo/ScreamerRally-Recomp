[package]
name = "sr-viseditor"
description = "The visibility editor's window: the track from above, sectors drawn or hidden per camera cell (docs/05-visibility-editor.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sr-runtime = { path = "../sr-runtime" }
sr-render = { path = "../sr-render" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }
